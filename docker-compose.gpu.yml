services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: silencer-discord-bot:gpu
    env_file:
      - .env
    volumes:
      - ./prompts:/app/prompts:ro
      - whisper-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  whisper-cache:
