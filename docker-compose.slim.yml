services:
  bot:
    build:
      context: .
      args:
        BOT_PROFILE: slim
    image: silencer-discord-bot:slim
    container_name: silencer-discord-bot-slim
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_PROFILE: slim
    stop_grace_period: 10s
    volumes:
      - ./prompts:/app/prompts:ro
    deploy:
      resources:
        limits:
          memory: 768M
